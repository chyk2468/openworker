<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">OpenWorker workflow</title><desc id="desc">A desktop AI coworker plans a task, calls the chosen model and authorised tools, then returns a document or completed action for the user.</desc><rect width="1200" height="400" rx="18" fill="#F2F1ED"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#557D69">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#292D2B">OpenWorker</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#777C77">A user task to finished desktop work</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#DCDDD5"/><path d="M 300 237 L 330 237" stroke="#777C77" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#777C77" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#777C77" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#777C77" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#777C77" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#777C77" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#DCDDD5" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#557D69"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#557D69">01 / TASK</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#292D2B">User request</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777C77">Describe the work to complete.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#DCDDD5" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#B18B4F"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#B18B4F">02 / PLAN</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#292D2B">Agent runtime</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777C77">Choose steps and required tools.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#DCDDD5" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#6E8792"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#6E8792">03 / ACT</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#292D2B">Models + integrations</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777C77">Execute allowed actions.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#DCDDD5" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#557D69"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#557D69">04 / DELIVER</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#292D2B">Finished work</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777C77">Review the output or action result.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#557D69">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777C77">Actions and data access depend on the selected model provider, integrations, and permission settings.</text></svg>