<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenWorker Architecture</title><style>:root{--bg:#F2F1ED;--ink:#292D2B;--muted:#777C77;--line:#DCDDD5;--card:#FFFFFF;--a:#557D69;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:clamp(20px,4vw,56px);background:var(--bg);color:var(--ink)}main{max-width:1200px;margin:auto}.tag{color:var(--a);text-transform:uppercase;letter-spacing:.15em;font-size:.75rem;font-weight:800}h1{font-size:clamp(2rem,5vw,3rem)}p{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:36px 0}.stage{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px 18px;min-height:200px;text-align:left;cursor:pointer;transition:transform .25s,border-color .25s}.stage:hover,.stage:focus-visible,.stage[aria-pressed=true]{transform:translateY(-5px);border-color:var(--a);outline:none}.stage h2{font-size:1.1rem}.stage p{font-size:.9rem}.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important}}</style></head><body><main><div class="tag">Interactive architecture</div><h1>OpenWorker</h1><p>An AI coworker that plans tasks and uses configured tools to deliver results. Select a stage to inspect its role.</p><section class="grid"><button class="stage" type="button" aria-pressed="true" data-i="0"><span class="tag">Stage 1 / TASK</span><h2>User request</h2><p>Describe the work to complete.</p></button><button class="stage" type="button" aria-pressed="false" data-i="1"><span class="tag">Stage 2 / PLAN</span><h2>Agent runtime</h2><p>Choose steps and required tools.</p></button><button class="stage" type="button" aria-pressed="false" data-i="2"><span class="tag">Stage 3 / ACT</span><h2>Models + tools</h2><p>Execute permitted actions.</p></button><button class="stage" type="button" aria-pressed="false" data-i="3"><span class="tag">Stage 4 / DELIVER</span><h2>Finished output</h2><p>Review the result or generated file.</p></button></section><section class="detail" aria-live="polite"><h2 id="heading">User request</h2><p id="body">Describe the work to complete.</p></section><p><a href="https://github.com/chyk2468/openworker" style="color:var(--a)">View repository</a></p></main><script>const stages=[["TASK","User request","Describe the work to complete."],["PLAN","Agent runtime","Choose steps and required tools."],["ACT","Models + tools","Execute permitted actions."],["DELIVER","Finished output","Review the result or generated file."]];document.querySelectorAll('.stage').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.stage').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.querySelector('#heading').textContent=stages[+b.dataset.i][1];document.querySelector('#body').textContent=stages[+b.dataset.i][2]}))</script></body></html>
